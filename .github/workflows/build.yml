name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Download fonts and pdf.js
        run: |
          mkdir -p app/src/main/assets/fonts
          mkdir -p app/src/main/assets/pdfjs

          BASE="https://raw.githubusercontent.com/google/fonts/main/ofl"

          download() {
            local url="$1"
            local out="$2"
            curl -sSL -o "$out" "$url" 2>/dev/null
            local size=$(stat -c%s "$out" 2>/dev/null || echo 0)
            if [ "$size" -lt 1000 ]; then
              echo "⚠ $out ($size bytes) — removing"
              rm -f "$out"
            else
              echo "✓ $out ($size bytes)"
            fi
          }

          cd app/src/main/assets/fonts
          download "$BASE/pirataone/PirataOne-Regular.ttf"                                  pirata.ttf
          download "$BASE/unifrakturmaguntia/UnifrakturMaguntia-Regular.ttf"                unifraktur.ttf
          download "$BASE/grenzegotisch/GrenzeGotisch%5Bwght%5D.ttf"                        grenze.ttf
          download "$BASE/medievalsharp/MedievalSharp-Regular.ttf"                          medieval.ttf
          download "$BASE/caveat/Caveat%5Bwght%5D.ttf"                                      caveat.ttf
          download "$BASE/kalam/Kalam-Regular.ttf"                                          kalam.ttf
          download "$BASE/shadowsintolight/ShadowsIntoLight.ttf"                            shadows.ttf
          download "$BASE/patrickhand/PatrickHand-Regular.ttf"                              patrick.ttf
          download "$BASE/gochihand/GochiHand-Regular.ttf"                                  gochi.ttf
          download "$BASE/homemadeapple/HomemadeApple-Regular.ttf"                          homemade.ttf
          cd -

          cd app/src/main/assets/pdfjs
          download "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"        pdf.min.js
          download "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js" pdf.worker.min.js
          cd -

          echo "--- fonts ---"
          ls -la app/src/main/assets/fonts/ || true
          echo "--- pdfjs ---"
          ls -la app/src/main/assets/pdfjs/ || true

      - run: gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: note88-apk
          path: app/build/outputs/apk/debug/*.apk
