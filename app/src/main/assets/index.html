<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Note88</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=UnifrakturMaguntia&family=Grenze+Gotisch:wght@400;700&family=MedievalSharp&family=Caveat:wght@400;700&family=Kalam:wght@400;700&family=Shadows+Into+Light&family=Patrick+Hand&family=Gochi+Hand&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
/* ---- tokens ---- */
:root{
  --ink: #2b2116;
  --ink-soft: #4a3a28;
  --shadow: rgba(60,40,20,.18);
  --gold: #b8862e;
  --red: #a82828;
  --font-ui: 'Patrick Hand', 'Segoe UI', system-ui, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', Menlo, monospace;
  --font-serif: 'Caveat', Georgia, serif;
  --radius: 14px;
  --ease: cubic-bezier(.2,.8,.2,1);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  height:100%;overflow:hidden;
  font-family:var(--font-ui);
  color:var(--ink);
  background:#1e1810;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit;border:0;background:none;outline:none}

.app{
  position:relative;height:100%;
  display:flex;flex-direction:column;
  max-width:760px;margin:0 auto;
  background:#211a12;
  box-shadow:0 0 40px rgba(0,0,0,.5);
}

/* ---- header ---- */
.hd{
  display:flex;align-items:center;justify-content:space-between;
  padding:14px 18px 10px;
  padding-top:calc(14px + env(safe-area-inset-top,0px));
  background:#2a2218;
  border-bottom:1px solid rgba(0,0,0,.3);
  flex-shrink:0;
}
.brand{
  font-family:'UnifrakturMaguntia',serif;
  font-size:22px;color:#e8d8a8;letter-spacing:.5px;
  text-shadow:0 1px 0 rgba(0,0,0,.4);
}
.brand em{font-style:normal;color:var(--red)}
.page-ind{
  font-family:var(--font-mono);font-size:11px;
  letter-spacing:.15em;color:#a08860;
  padding:4px 10px;border:1px solid rgba(180,140,80,.3);border-radius:999px;
}
.hd-actions{display:flex;gap:6px}
.icon-btn{
  width:38px;height:38px;border-radius:10px;
  display:grid;place-items:center;
  background:rgba(255,255,255,.05);
  transition:all .2s var(--ease);
}
.icon-btn:active{background:rgba(255,255,255,.12);transform:scale(.94)}
.icon-btn svg{width:20px;height:20px;fill:none;stroke:#c9b58c;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---- stage ---- */
.stage{
  flex:1;overflow:hidden;position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:16px;
  perspective:1400px;
}

.paper{
  position:relative;
  width:100%;height:100%;max-width:640px;
  border-radius:6px;
  box-shadow:0 20px 50px rgba(0,0,0,.55), 0 2px 0 rgba(255,255,255,.04) inset;
  padding:34px 30px 80px 30px;
  overflow:hidden;
  transition:transform .35s var(--ease);
  transform-style:preserve-3d;
  backface-visibility:hidden;
}

.paper::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .25  0 0 0 0 .12  0 0 0 .14 0'/></filter><rect width='240' height='240' filter='url(%23n)'/></svg>");
  mix-blend-mode:multiply;opacity:.9;
}

.paper::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    radial-gradient(ellipse at 20% 15%, rgba(255,240,200,.35), transparent 55%),
    radial-gradient(ellipse at 85% 85%, rgba(120,80,30,.25), transparent 55%);
}

/* Paper themes */
.theme-parchment{background:linear-gradient(160deg,#f0e2bd 0%,#e6d19a 45%,#d4b878 100%)}
.theme-linen{background:
  repeating-linear-gradient(to bottom,transparent 0,transparent 33px,rgba(80,60,40,.14) 33px,rgba(80,60,40,.14) 34px),
  linear-gradient(180deg,#efe1c0 0%,#ddc99a 100%)}
.theme-sticky{background:linear-gradient(180deg,#f7ea9a 0%,#eadc72 100%)}
.theme-kraft{background:linear-gradient(150deg,#dcc69b 0%,#c9a878 60%,#b08858 100%)}
.theme-cream{background:linear-gradient(180deg,#faf3e0 0%,#f1e7cc 100%)}

/* ---- editor ---- */
.editor{
  position:relative;z-index:1;
  width:100%;height:100%;
  overflow-y:auto;
  font-family:'Caveat',cursive;
  font-size:22px;line-height:1.7;
  color:var(--ink);
  outline:none;
  padding-right:6px;
  word-wrap:break-word;
  white-space:pre-wrap;
  direction:auto;
}
.editor:empty::before{
  content:'Start writing…';
  color:rgba(60,40,20,.35);
  font-style:italic;
  pointer-events:none;
}
.editor[dir="rtl"]{text-align:right}
.editor mark{padding:1px 3px;border-radius:3px;color:inherit}
.editor mark.hl-yellow{background:rgba(255,222,80,.7)}
.editor mark.hl-green{background:rgba(150,220,120,.6)}
.editor mark.hl-pink{background:rgba(255,170,190,.6)}
.editor mark.hl-blue{background:rgba(150,200,255,.6)}
.editor mark.hl-orange{background:rgba(255,180,120,.65)}

/* ---- wax seal ---- */
.seal{
  position:absolute;bottom:22px;right:22px;z-index:2;
  width:60px;height:60px;border-radius:50%;
  background:
    radial-gradient(circle at 32% 28%, #d84a3a 0%, #b02a2a 40%, #7a1212 75%, #4a0808 100%);
  box-shadow:
    inset -3px -4px 10px rgba(0,0,0,.55),
    inset 3px 3px 8px rgba(255,200,150,.25),
    0 6px 14px rgba(60,10,10,.5);
  display:grid;place-items:center;
  color:rgba(245,220,180,.85);
  font-family:'UnifrakturMaguntia',serif;
  font-size:16px;letter-spacing:1px;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
  pointer-events:none;
  transition:opacity .4s var(--ease);
}
.seal::before{
  content:'';position:absolute;inset:6px;border-radius:50%;
  border:1px dashed rgba(245,220,180,.45);
}
.seal::after{
  content:'';position:absolute;inset:12px;border-radius:50%;
  border:1px solid rgba(245,220,180,.25);
}
body.reading .seal{opacity:.5}

/* ---- footer toolbar ---- */
.tb{
  display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:12px 18px;
  padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));
  background:#2a2218;
  border-top:1px solid rgba(0,0,0,.3);
  flex-shrink:0;
}
.tb-btn{
  flex:1;height:46px;border-radius:12px;
  display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(255,255,255,.05);
  transition:all .18s var(--ease);
  font-family:var(--font-mono);font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;
  color:#b8a375;
}
.tb-btn:active{background:rgba(255,255,255,.12);transform:scale(.96)}
.tb-btn.primary{background:rgba(184,134,46,.18);color:#e8c98a}
.tb-btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tb-btn span{display:none}
@media (min-width:520px){.tb-btn span{display:inline}}

/* ---- sheet (bottom panel) ---- */
.sheet{
  position:absolute;left:0;right:0;bottom:0;z-index:50;
  background:#2a2218;
  border-top-left-radius:20px;border-top-right-radius:20px;
  box-shadow:0 -20px 60px rgba(0,0,0,.6);
  transform:translateY(100%);
  transition:transform .35s var(--ease);
  max-height:72vh;overflow-y:auto;
}
.sheet.on{transform:translateY(0)}
.sheet-head{
  display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px 12px;
  border-bottom:1px solid rgba(0,0,0,.3);
  position:sticky;top:0;background:#2a2218;z-index:2;
}
.sheet-title{font-family:'UnifrakturMaguntia',serif;font-size:19px;color:#e8d8a8}
.sheet-close{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.06)}
.sheet-close svg{width:18px;height:18px;fill:none;stroke:#c9b58c;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sheet-body{padding:14px 18px 24px}

.grid{display:grid;gap:10px}
.grid-2{grid-template-columns:repeat(2,1fr)}
.grid-3{grid-template-columns:repeat(3,1fr)}

.font-card{
  padding:14px 12px;border-radius:12px;
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.06);
  display:flex;flex-direction:column;gap:6px;
  text-align:center;
  transition:all .2s var(--ease);
}
.font-card:active{transform:scale(.97)}
.font-card.active{border-color:rgba(184,134,46,.6);background:rgba(184,134,46,.1)}
.font-card .preview{
  font-size:22px;color:#f0e2bd;
  line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.font-card .name{
  font-family:var(--font-mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;color:#8a7a55;
}

.theme-card{
  aspect-ratio:1;border-radius:12px;position:relative;
  border:2px solid transparent;
  overflow:hidden;
}
.theme-card.active{border-color:#e8c98a}
.theme-card .label{
  position:absolute;left:0;right:0;bottom:0;
  padding:5px 6px;font-family:var(--font-mono);font-size:9px;
  letter-spacing:.1em;text-transform:uppercase;
  background:rgba(0,0,0,.45);color:#f0e2bd;text-align:center;
}

.action{
  padding:16px 14px;border-radius:12px;
  background:rgba(255,255,255,.05);
  display:flex;align-items:center;gap:12px;
  text-align:left;
  transition:all .18s var(--ease);
  width:100%;
}
.action:active{background:rgba(255,255,255,.12);transform:scale(.98)}
.action svg{width:22px;height:22px;fill:none;stroke:#e8c98a;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.action .txt{flex:1;font-family:var(--font-ui);font-size:15px;color:#e8d8a8}
.action .sub{font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#8a7a55;margin-top:2px}

.toggle{
  width:44px;height:26px;border-radius:999px;
  background:rgba(255,255,255,.08);position:relative;
  transition:background .25s var(--ease);flex-shrink:0;
}
.toggle.on{background:rgba(184,134,46,.6)}
.toggle::after{
  content:'';position:absolute;top:3px;left:3px;
  width:20px;height:20px;border-radius:50%;
  background:#f0e2bd;
  transition:transform .25s var(--ease);
}
.toggle.on::after{transform:translateX(18px)}

/* ---- floating highlight palette ---- */
.hl-palette{
  position:absolute;z-index:60;
  display:none;gap:6px;padding:8px;
  background:#2a2218;
  border-radius:12px;
  box-shadow:0 12px 30px rgba(0,0,0,.5);
  border:1px solid rgba(184,134,46,.3);
}
.hl-palette.on{display:flex;animation:popIn .2s var(--ease)}
@keyframes popIn{from{opacity:0;transform:translateY(4px) scale(.9)}to{opacity:1;transform:translateY(0) scale(1)}}
.hl-dot{
  width:30px;height:30px;border-radius:8px;
  transition:transform .15s var(--ease);
}
.hl-dot:active{transform:scale(.85)}

/* ---- page flip animations ---- */
@keyframes flipOut{
  0%{transform:perspective(1400px) rotateY(0);opacity:1}
  100%{transform:perspective(1400px) rotateY(-90deg);opacity:0}
}
@keyframes flipIn{
  0%{transform:perspective(1400px) rotateY(90deg);opacity:0}
  100%{transform:perspective(1400px) rotateY(0);opacity:1}
}
.paper.flip-out{animation:flipOut .3s var(--ease) forwards;transform-origin:left center}
.paper.flip-in{animation:flipIn .3s var(--ease) forwards;transform-origin:right center}

/* ---- ash delete ---- */
@keyframes ash{
  0%{opacity:1;filter:blur(0);transform:translateY(0) scale(1)}
  40%{opacity:.85;filter:blur(1px);transform:translateY(4px) scale(.995)}
  70%{opacity:.4;filter:blur(4px);transform:translateY(16px) scale(.98)}
  100%{opacity:0;filter:blur(14px);transform:translateY(40px) scale(.94)}
}
.paper.ash{animation:ash 1.05s var(--ease) forwards;pointer-events:none}

/* ---- reading mode ---- */
body.reading .tb{opacity:.35}
body.reading .tb .tb-btn:not(.read-toggle){pointer-events:none}
body.reading .editor{cursor:default}
body.reading .paper{padding-top:44px}

/* ---- toast ---- */
.toast{
  position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));
  transform:translate(-50%,16px);
  padding:10px 18px;border-radius:999px;
  background:#2a2218;color:#e8c98a;
  font-family:var(--font-mono);font-size:11px;
  letter-spacing:.14em;text-transform:uppercase;
  border:1px solid rgba(184,134,46,.4);
  box-shadow:0 10px 30px rgba(0,0,0,.5);
  opacity:0;pointer-events:none;
  transition:all .3s var(--ease);
  z-index:200;max-width:calc(100vw - 40px);
  text-align:center;font-weight:600;
}
.toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="app">

  <header class="hd">
    <div class="brand">Note<em>88</em></div>
    <div class="page-ind" id="pageInd">1 / 1</div>
    <div class="hd-actions">
      <button class="icon-btn" id="btnRead" aria-label="Read mode">
        <svg viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></svg>
      </button>
      <button class="icon-btn" id="btnMenu" aria-label="Menu">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="12" cy="19" r="1.5"/></svg>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="paper theme-parchment" id="paper">
      <div class="editor" id="editor" contenteditable="true" spellcheck="false" dir="auto"></div>
      <div class="seal" aria-hidden="true">MC88</div>
    </div>
  </main>

  <nav class="tb">
    <button class="tb-btn" id="btnPrev" aria-label="Previous">
      <svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
      <span>Prev</span>
    </button>
    <button class="tb-btn" id="btnFont" aria-label="Font">
      <svg viewBox="0 0 24 24"><path d="M4 20 10 4h4l6 16"/><path d="M6.5 14h11"/></svg>
      <span>Font</span>
    </button>
    <button class="tb-btn" id="btnHighlight" aria-label="Highlight">
      <svg viewBox="0 0 24 24"><path d="m9 11 6 6-3 3H3v-3z"/><path d="m14 6 4 4-9 9-4-4z"/><path d="M18 4h3M19.5 2.5v3"/></svg>
      <span>Mark</span>
    </button>
    <button class="tb-btn" id="btnNew" aria-label="New page">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      <span>New</span>
    </button>
    <button class="tb-btn primary" id="btnNext" aria-label="Next">
      <svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
      <span>Next</span>
    </button>
  </nav>

  <!-- highlight palette (floats above selection) -->
  <div class="hl-palette" id="hlPalette">
    <button class="hl-dot" data-color="hl-yellow" style="background:rgba(255,222,80,.85)"></button>
    <button class="hl-dot" data-color="hl-green" style="background:rgba(150,220,120,.85)"></button>
    <button class="hl-dot" data-color="hl-pink" style="background:rgba(255,170,190,.85)"></button>
    <button class="hl-dot" data-color="hl-blue" style="background:rgba(150,200,255,.85)"></button>
    <button class="hl-dot" data-color="hl-orange" style="background:rgba(255,180,120,.9)"></button>
    <button class="hl-dot" data-color="clear" style="background:#2a2218;border:1px solid rgba(255,255,255,.15);display:grid;place-items:center">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#e8c98a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <!-- fonts sheet -->
  <div class="sheet" id="sheetFont">
    <div class="sheet-head">
      <div class="sheet-title">Choose a font</div>
      <button class="sheet-close" data-close="sheetFont"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="grid grid-2" id="fontGrid"></div>
    </div>
  </div>

  <!-- themes sheet -->
  <div class="sheet" id="sheetTheme">
    <div class="sheet-head">
      <div class="sheet-title">Paper</div>
      <button class="sheet-close" data-close="sheetTheme"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="grid grid-3" id="themeGrid"></div>
    </div>
  </div>

  <!-- menu sheet -->
  <div class="sheet" id="sheetMenu">
    <div class="sheet-head">
      <div class="sheet-title">Menu</div>
      <button class="sheet-close" data-close="sheetMenu"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="sheet-body">
      <div class="grid" style="gap:10px">
        <button class="action" id="actTheme">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 3v18"/></svg>
          <div class="txt">Paper theme<div class="sub">Texture of the page</div></div>
        </button>
        <button class="action" id="actExport">
          <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
          <div class="txt">Export .txt<div class="sub">Save all pages as text</div></div>
        </button>
        <button class="action" id="actDelete">
          <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>
          <div class="txt">Delete page<div class="sub">It becomes ash</div></div>
        </button>
        <div class="action" style="cursor:default">
          <svg viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg>
          <div class="txt">Sounds<div class="sub">Tap feedback</div></div>
          <button class="toggle on" id="togSound"></button>
        </div>
        <div class="action" style="cursor:default">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v4l3 2"/></svg>
          <div class="txt">Note88 · v1.0<div class="sub">MC88 · Mohamed Cheikh</div></div>
        </div>
      </div>
    </div>
  </div>

</div>
<div class="toast" id="toast"></div>

<script>
'use strict';

/* -------- dom -------- */
const $ = id => document.getElementById(id);
const editor   = $('editor');
const paper    = $('paper');
const pageInd  = $('pageInd');
const stage    = $('stage');
const toastEl  = $('toast');
const hlPal    = $('hlPalette');

/* -------- fonts -------- */
const FONTS = [
  { id:'pirata',    name:'Pirata',     family:"'Pirata One', serif",              sample:'Hello' },
  { id:'unifraktur',name:'Unifraktur', family:"'UnifrakturMaguntia', serif",      sample:'Hello' },
  { id:'grenze',    name:'Grenze',     family:"'Grenze Gotisch', serif",          sample:'Hello' },
  { id:'medieval',  name:'Medieval',   family:"'MedievalSharp', serif",           sample:'Hello' },
  { id:'caveat',    name:'Caveat',     family:"'Caveat', cursive",                sample:'Hello' },
  { id:'kalam',     name:'Kalam',      family:"'Kalam', cursive",                 sample:'Hello' },
  { id:'shadows',   name:'Shadows',    family:"'Shadows Into Light', cursive",    sample:'Hello' },
  { id:'patrick',   name:'Patrick',    family:"'Patrick Hand', cursive",          sample:'Hello' },
  { id:'gochi',     name:'Gochi',      family:"'Gochi Hand', cursive",            sample:'Hello' },
  { id:'homemade',  name:'Homemade',   family:"'Homemade Apple', cursive",        sample:'Hello' }
];

/* -------- themes -------- */
const THEMES = [
  { id:'parchment', name:'Parchment', cls:'theme-parchment' },
  { id:'linen',     name:'Linen',     cls:'theme-linen' },
  { id:'sticky',    name:'Sticky',    cls:'theme-sticky' },
  { id:'kraft',     name:'Kraft',     cls:'theme-kraft' },
  { id:'cream',     name:'Cream',     cls:'theme-cream' }
];

/* -------- state -------- */
const KEY = 'note88.v1';
let state = {
  pages: [{ id:'p1', html:'', font:'caveat' }],
  index: 0,
  theme: 'parchment',
  sound: true
};

function load(){
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
    if (!state.pages.length) state.pages = [{ id:'p1', html:'', font:'caveat' }];
    if (state.index < 0 || state.index >= state.pages.length) state.index = 0;
  } catch(_) {}
}
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(_) {}
}

/* -------- audio -------- */
let audioCtx = null;
function initAudio(){ if(audioCtx) return; try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(_){} }
function beep(freq, dur, vol){
  if (!state.sound || !audioCtx) return;
  const t = audioCtx.currentTime;
  const o = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  o.type = 'sine';
  o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t); o.stop(t + dur + 0.03);
}
const sfx = {
  tap:   () => beep(1400, 0.025, 0.05),
  flip:  () => { beep(700, 0.05, 0.05); setTimeout(()=>beep(1000,0.07,0.045), 40); },
  newP:  () => { beep(900, 0.05, 0.05); setTimeout(()=>beep(1300,0.08,0.045), 50); },
  ash:   () => { beep(500, 0.14, 0.05); setTimeout(()=>beep(300,0.22,0.04), 90); },
  erase: () => beep(220, 0.18, 0.045)
};

/* -------- toast -------- */
let toastTimer;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>toastEl.classList.remove('on'), 2000);
}

/* -------- rendering -------- */
function applyTheme(){
  THEMES.forEach(t => paper.classList.remove(t.cls));
  const t = THEMES.find(x => x.id === state.theme) || THEMES[0];
  paper.classList.add(t.cls);
  document.querySelectorAll('.theme-card').forEach(el => {
    el.classList.toggle('active', el.dataset.theme === t.id);
  });
}

function applyFont(fontId){
  const f = FONTS.find(x => x.id === fontId) || FONTS[4];
  editor.style.fontFamily = f.family;
  document.querySelectorAll('.font-card').forEach(el => {
    el.classList.toggle('active', el.dataset.font === f.id);
  });
}

function renderPage(){
  const p = state.pages[state.index];
  editor.innerHTML = p.html || '';
  applyFont(p.font || 'caveat');
  pageInd.textContent = (state.index + 1) + ' / ' + state.pages.length;
  updateDirAuto();
}

function updateDirAuto(){
  const txt = editor.textContent || '';
  const arabic = /[\u0600-\u06FF]/.test(txt);
  editor.setAttribute('dir', arabic ? 'rtl' : 'ltr');
}

/* -------- persistence with debounce -------- */
let saveTimer;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    state.pages[state.index].html = editor.innerHTML;
    save();
  }, 400);
}

editor.addEventListener('input', () => {
  updateDirAuto();
  scheduleSave();
});
editor.addEventListener('blur', () => {
  state.pages[state.index].html = editor.innerHTML;
  save();
});

/* -------- page flip -------- */
let flipping = false;
function flipTo(newIndex, direction){
  if (flipping || newIndex === state.index) return;
  if (newIndex < 0 || newIndex >= state.pages.length) return;
  flipping = true;

  // save current before leaving
  state.pages[state.index].html = editor.innerHTML;
  state.index = newIndex;
  save();

  paper.classList.add(direction > 0 ? 'flip-out' : 'flip-in');
  sfx.flip();

  setTimeout(() => {
    paper.classList.remove('flip-out', 'flip-in');
    renderPage();
    paper.classList.add(direction > 0 ? 'flip-in' : 'flip-out');
    setTimeout(() => {
      paper.classList.remove('flip-in', 'flip-out');
      flipping = false;
    }, 300);
  }, 300);
}

/* -------- new page -------- */
function newPage(){
  state.pages[state.index].html = editor.innerHTML;
  const id = 'p' + Date.now();
  state.pages.push({ id, html:'', font: state.pages[state.index].font || 'caveat' });
  const dir = 1;
  state.index = state.pages.length - 1;
  save();

  paper.classList.add('flip-out');
  sfx.newP();
  setTimeout(() => {
    paper.classList.remove('flip-out');
    renderPage();
    paper.classList.add('flip-in');
    setTimeout(() => paper.classList.remove('flip-in'), 320);
  }, 300);
  toast('New page');
}

/* -------- delete current page -------- */
function deletePage(){
  if (state.pages.length === 1){
    // last page — clear instead
    editor.innerHTML = '';
    state.pages[0].html = '';
    save();
    sfx.erase();
    toast('Page cleared');
    return;
  }
  sfx.ash();
  paper.classList.add('ash');
  setTimeout(() => {
    paper.classList.remove('ash');
    state.pages.splice(state.index, 1);
    if (state.index >= state.pages.length) state.index = state.pages.length - 1;
    save();
    renderPage();
    paper.classList.add('flip-in');
    setTimeout(() => paper.classList.remove('flip-in'), 320);
  }, 1050);
  toast('Page turned to ash');
}

/* -------- highlight palette -------- */
let savedRange = null;

function saveSelection(){
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0) {
    const r = sel.getRangeAt(0);
    if (editor.contains(r.commonAncestorContainer)) savedRange = r.cloneRange();
  }
}

function showPalette(){
  if (!savedRange || savedRange.collapsed) return;
  const rect = savedRange.getBoundingClientRect();
  const stageRect = stage.getBoundingClientRect();
  const top = rect.top - stageRect.top - 56;
  const left = Math.max(12, Math.min(rect.left - stageRect.left + rect.width/2 - 130, stageRect.width - 260));
  hlPal.style.top = Math.max(8, top) + 'px';
  hlPal.style.left = left + 'px';
  hlPal.classList.add('on');
}
function hidePalette(){
  hlPal.classList.remove('on');
}

document.addEventListener('selectionchange', () => {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed){
    hidePalette();
    return;
  }
  const r = sel.getRangeAt(0);
  if (editor.contains(r.commonAncestorContainer)){
    saveSelection();
    showPalette();
  } else {
    hidePalette();
  }
});

hlPal.addEventListener('click', e => {
  const btn = e.target.closest('.hl-dot');
  if (!btn) return;
  const color = btn.dataset.color;
  if (!savedRange) return;

  // restore selection
  const sel = window.getSelection();
  sel.removeAllRanges();
  sel.addRange(savedRange);

  if (color === 'clear'){
    document.execCommand('removeFormat', false, null);
    // also unwrap existing marks
    const html = editor.innerHTML;
    editor.innerHTML = html.replace(/<mark[^>]*>(.*?)<\/mark>/g, '$1');
  } else {
    // paint using hiliteColor with a semi-transparent overlay via <mark> wrapper if needed
    // simplest cross-platform: use hiliteColor with rgb
    const colorMap = {
      'hl-yellow': 'rgba(255,222,80,.7)',
      'hl-green':  'rgba(150,220,120,.6)',
      'hl-pink':   'rgba(255,170,190,.6)',
      'hl-blue':   'rgba(150,200,255,.6)',
      'hl-orange': 'rgba(255,180,120,.65)'
    };
    document.execCommand('hiliteColor', false, colorMap[color]);
  }

  state.pages[state.index].html = editor.innerHTML;
  save();
  hidePalette();
  sfx.tap();
});

/* -------- sheets -------- */
function openSheet(id){
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on'));
  const el = document.getElementById(id);
  if (el) el.classList.add('on');
}
function closeSheets(){
  document.querySelectorAll('.sheet').forEach(s => s.classList.remove('on'));
}
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', () => { closeSheets(); sfx.tap(); });
});

/* -------- build font grid -------- */
const fontGrid = $('fontGrid');
FONTS.forEach(f => {
  const card = document.createElement('button');
  card.className = 'font-card';
  card.dataset.font = f.id;
  card.innerHTML = `
    <div class="preview" style="font-family:${f.family}">${f.sample}</div>
    <div class="name">${f.name}</div>
  `;
  card.addEventListener('click', () => {
    state.pages[state.index].font = f.id;
    save();
    applyFont(f.id);
    sfx.tap();
    toast(f.name);
  });
  fontGrid.appendChild(card);
});

/* -------- build theme grid -------- */
const themeGrid = $('themeGrid');
THEMES.forEach(t => {
  const card = document.createElement('button');
  card.className = 'theme-card';
  card.dataset.theme = t.id;
  card.classList.add(t.cls);
  card.innerHTML = `<div class="label">${t.name}</div>`;
  card.addEventListener('click', () => {
    state.theme = t.id;
    save();
    applyTheme();
    sfx.tap();
    toast(t.name);
  });
  themeGrid.appendChild(card);
});

/* -------- toolbar actions -------- */
$('btnPrev').addEventListener('click', () => { sfx.tap(); flipTo(state.index - 1, -1); });
$('btnNext').addEventListener('click', () => { sfx.tap(); flipTo(state.index + 1, 1); });
$('btnNew').addEventListener('click', newPage);
$('btnFont').addEventListener('click', () => { sfx.tap(); openSheet('sheetFont'); });
$('btnHighlight').addEventListener('click', () => {
  sfx.tap();
  // trigger by saving current selection — palette may already be visible
  saveSelection();
  if (savedRange && !savedRange.collapsed) showPalette();
  else toast('Select text first');
});
$('btnMenu').addEventListener('click', () => { sfx.tap(); openSheet('sheetMenu'); });
$('btnRead').addEventListener('click', () => {
  document.body.classList.toggle('reading');
  sfx.tap();
  toast(document.body.classList.contains('reading') ? 'Reading mode' : 'Edit mode');
});

/* -------- menu actions -------- */
$('actTheme').addEventListener('click', () => { sfx.tap(); openSheet('sheetTheme'); });
$('actDelete').addEventListener('click', () => { closeSheets(); deletePage(); });

$('actExport').addEventListener('click', () => {
  sfx.tap();
  // strip html + join pages
  const div = document.createElement('div');
  const parts = state.pages.map((p, i) => {
    div.innerHTML = p.html || '';
    const text = (div.textContent || '').trim();
    return `— Page ${i + 1} —\n${text || '(empty)'}`;
  });
  const out = 'Note88 — ' + new Date().toLocaleString() + '\n\n' + parts.join('\n\n');
  const name = 'note88-' + Date.now() + '.txt';
  if (window.Android && Android.exportTxt) Android.exportTxt(out, name);
  else toast('Export not available');
  closeSheets();
});

$('togSound').addEventListener('click', e => {
  e.stopPropagation();
  state.sound = !state.sound;
  $('togSound').classList.toggle('on', state.sound);
  save();
  if (state.sound) sfx.tap();
});

/* -------- prevent zoom on double-tap -------- */
let lastTouch = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - lastTouch < 300) e.preventDefault();
  lastTouch = now;
}, { passive: false });

/* -------- boot -------- */
load();
applyTheme();
applyFont(state.pages[state.index].font || 'caveat');
renderPage();
$('togSound').classList.toggle('on', state.sound);

// unlock audio on first interaction
document.addEventListener('touchstart', initAudio, { once:true });
document.addEventListener('click', initAudio, { once:true });

console.log('© 2026 MC88 — Mohamed Cheikh');
</script>
